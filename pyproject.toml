[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-trading-system-v2"
version = "0.1.0"
description = "Momentum Trading System v2"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Core*"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
addopts = "-ra"
pythonpath = ["."]
